name: viberent

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ${VIBERENT_ENV_FILE:-.env.docker}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    image: viberent-web:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${VIBERENT_ENV_FILE:-.env.docker}
    environment:
      VIBERENT_DATABASE: postgres
      VIBERENT_DESKTOP: "0"
      PRIVATE_FILE_STORAGE_ROOT: /app/.data/private-files
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      # WhatsApp sessions (whatsapp.db), the Google Drive session and other runtime state live in
      # /app/.data. Without this volume every redeploy logs agencies out of WhatsApp.
      - app_data:/app/.data
      - private_files:/app/.data/private-files

volumes:
  postgres_data:
  private_files:
  app_data:
